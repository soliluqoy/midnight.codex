name: Midnight Windows build

on:
  push:
    branches: [midnight/sidebar]
  pull_request:
    branches: [midnight/sidebar]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: midnight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: codex-rs
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      RUST_MIN_STACK: '8388608'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt -p codex-tui -p codex-cli -- --check
      - name: Sidebar tests
        run: cargo test --locked -p codex-tui --lib midnight
      - name: Transcript regression tests
        run: cargo test --locked -p codex-tui --lib owned_transcript -- --test-threads=1
      - name: Build
        run: cargo build --locked -p codex-cli --bin codex
      - name: Package
        run: |
          New-Item -ItemType Directory -Path ../midnight-dist -Force | Out-Null
          Copy-Item -LiteralPath target/debug/codex.exe -Destination ../midnight-dist/midnight-codex.exe
          & ../midnight-dist/midnight-codex.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath ../midnight-dist/midnight-codex.exe).Hash.ToLowerInvariant()
          "$hash  midnight-codex.exe" | Set-Content -Encoding ascii -LiteralPath ../midnight-dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: midnight-codex-windows-x64
          path: midnight-dist/
          if-no-files-found: error
